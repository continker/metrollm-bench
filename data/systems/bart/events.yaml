        station_name: "MacArthur"
        reason: "Emergency track repair"
        nearest_alternatives: ["BART-19TH", "BART-ASHB", "BART-ROCK"]
        advisory_must_mention: ["macarthur", "closed", "track repair"]
        blocked_stations: ["BART-MCAR"]
        blocked_edges: []

