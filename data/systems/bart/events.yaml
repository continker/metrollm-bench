          severity: "critical"
          message: "12th St Oakland station closed due to flooding from water main break. No service through this station. Use 19th St Oakland or Lake Merritt as alternatives."
          alternative: "Use 19th St Oakland (northbound) or Lake Merritt (southbound/eastbound)"
