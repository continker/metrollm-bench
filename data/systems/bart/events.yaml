        station_name: "Embarcadero"
        reason: "Police activity"
        nearest_alternatives: ["BART-MONT"]
        advisory_must_mention: ["embarcadero", "closed", "police"]
        blocked_stations: ["BART-EMBR"]
        blocked_edges: []

